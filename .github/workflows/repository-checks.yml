name: Repository checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/validate-repository.mjs
      - name: Test level completion report
        run: node --test scripts/report-level-validation.test.mjs
      - name: Test validation runner
        shell: pwsh
        run: ./scripts/test-check-unity.ps1
      - name: Test catalog search portfolio
        shell: pwsh
        run: ./scripts/test-validate-catalog.ps1
